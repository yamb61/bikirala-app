<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiKirala | Premium</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #FFD000; --dark: #1a1a1a; --gray: #f4f6f8; }
        body { background-color: var(--gray); font-family: 'Inter', sans-serif; padding-bottom: 90px; }

        /* === ÜST HEADER (Sabit) === */
        .header {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 15px; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #eee;
        }
        .logo-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-weight: 800; font-size: 24px; color: var(--dark); letter-spacing: -1px; }
        .logo span { color: var(--primary); }
        
        /* Arama Kutusu */
        .search-container { position: relative; }
        .search-input {
            width: 100%; background: #f0f2f5; border: none; padding: 12px 45px 12px 20px;
            border-radius: 15px; font-size: 14px; transition: 0.3s;
        }
        .search-input:focus { background: white; box-shadow: 0 0 0 2px var(--primary); outline: none; }
        .search-icon { position: absolute; right: 15px; top: 12px; color: #999; }

        /* === DÜZEN (Layout) === */
        .main-layout { display: flex; gap: 20px; padding: 20px 15px; }
        
        /* SOL KATEGORİ MENÜSÜ (Masaüstünde Solda, Mobilde Üstte) */
        .sidebar {
            width: 250px; flex-shrink: 0; display: none; /* Mobilde js ile yönetiriz yada css ile */
        }
        /* Mobilde Yatay Scroll */
        .mobile-cats {
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 15px; 
            background: white; border-bottom: 1px solid #eee; scrollbar-width: none;
        }
        .mobile-cats::-webkit-scrollbar { display: none; }
        
        .cat-chip {
            white-space: nowrap; padding: 8px 16px; border-radius: 20px;
            background: white; border: 1px solid #eee; color: #555; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: 0.2s;
        }
        .cat-chip.active { background: var(--dark); color: var(--primary); border-color: var(--dark); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* İÇERİK ALANI */
        .content-area { flex-grow: 1; }

        /* === KART TASARIMI (Premium) === */
        .item-card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px;
            transition: transform 0.2s; position: relative; border: 1px solid #f0f0f0;
        }
        .item-card:active { transform: scale(0.98); }
        .card-img { width: 100%; height: 220px; object-fit: cover; }
        .card-price {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.8); color: var(--primary);
            padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .card-body { padding: 15px; }
        .card-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; color: var(--dark); }
        .card-meta { font-size: 12px; color: #888; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }
