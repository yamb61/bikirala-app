<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiKirala | Final</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; padding-bottom: 80px; }
        
        .header { background: #FFD000; padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .cat-scroll { overflow-x: auto; white-space: nowrap; padding: 10px; background: white; border-bottom: 1px solid #ddd; }
        .cat-btn { display: inline-block; padding: 8px 15px; border-radius: 20px; background: #eee; color: #333; margin-right: 5px; cursor: pointer; font-size: 13px; font-weight: bold; border: none; }
        .cat-btn.active { background: black; color: #FFD000; }

        .card { border: none; border-radius: 10px; margin-bottom: 15px; background: white; overflow: hidden; }
        .card-img-top { height: 200px; object-fit: cover; }
        .price { position: absolute; top: 10px; left: 10px; background: black; color: #FFD000; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 9999; }
        .nav-item { text-align: center; color: #aaa; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: black; font-weight: bold; }
        .add-btn { width: 50px; height: 50px; background: black; color: #FFD000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -25px; border: 4px solid #f4f4f4; }

        .page { display: none; }
        .page.active { display: block; }
        
        #hataKutusu { display: none; background: red; color: white; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="hataKutusu"></div>

    <div class="header d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold"><i class="fas fa-cube"></i> bi<span style="background:black; color:white; padding:0 3px; border-radius:3px;">kirala</span></h4>
    </div>

    <div class="cat-scroll">
        <button class="cat-btn active" onclick="kategoriDegis('Hepsi', this)">Tümü</button>
        <button class="cat-btn" onclick="kategoriDegis('Vasıta', this)">🚗 Vasıta</button>
        <button class="cat-btn" onclick="kategoriDegis('Elektronik', this)">💻 Elektronik</button>
        <button class="cat-btn" onclick="kategoriDegis('Emlak', this)">🏠 Emlak</button>
        <button class="cat-btn" onclick="kategoriDegis('Spor', this)">⚽ Spor</button>
    </div>

    <div class="container mt-3">
        <div id="page-home" class="page active">
            <input type="text" id="arama" class="form-control mb-3 rounded-pill" placeholder="Ne arıyorsun? (PS5, Drone...)" onkeyup="listeyiYenile()">
            
            <div id="ilan-listesi">
                <div class="text-center mt-5">
                    <div class="spinner-border text-warning"></div>
                    <p>Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div id="page-fav" class="page text-center pt-5"><h5>Favoriler</h5><p>Boş.</p></div>
        <div id="page-msg" class="page text-center pt-5"><h5>Mesajlar</h5><p>Mesaj yok.</p></div>
        <div id="page-profile" class="page text-center pt-5"><h5>Profil</h5><p>Misafir</p></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="sayfa('home', this)"><i class="fas fa-home"></i>Vitrin</div>
        <div class="nav-item" onclick="sayfa('fav', this)"><i class="fas fa-heart"></i>Favori</div>
        <div class="nav-item" onclick="modalAc()"><div class="add-btn"><i class="fas fa-
