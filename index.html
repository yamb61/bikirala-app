<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiKirala | Hata Ayıklama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #FFD000; padding: 15px 0; }
        #hataKutusu { display: none; background: #ffebee; border: 2px solid #ef5350; color: #c62828; padding: 20px; margin: 20px; border-radius: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BiKirala (Test Modu)</a>
            <button class="btn btn-dark" onclick="modalAc()">İlan Ver</button>
        </div>
    </nav>

    <div class="container">
        <div id="hataKutusu"></div>
    </div>

    <div class="container mt-4">
        <h5 id="durumMesaji">Veritabanına Bağlanılıyor...</h5>
        <div class="row" id="ilan-listesi">
            <div class="text-center py-5"><div class="spinner-border text-warning"></div></div>
        </div>
    </div>

    <div class="modal fade" id="ilanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">İlan Ver</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="text" id="urunAdi" class="form-control mb-2" placeholder="Ürün Adı">
                    <input type="text" id="fiyat" class="form-control mb-2" placeholder="Fiyat">
                    <button onclick="ilanGonder()" class="btn btn-warning w-100">Yayınla</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        // Hataları ekrana basan fonksiyon
        window.hataGoster = function(msg) {
            const kutu = document.getElementById('hataKutusu');
            kutu.style.display = 'block';
            kutu.innerHTML += "⚠️ HATA: " + msg + "<br><hr>";
        }

        // Global hata yakalayıcı
        window.onerror = function(msg, url, line) {
            window.hataGoster(msg + " (Satır: " + line + ")");
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARO3eKpa058215Sdo3Dqf6U7uTr-z4pMM",
            authDomain: "kiralagitsin-855c9.firebaseapp.com",
            projectId: "kiralagitsin-855c9",
            storageBucket: "kiralagitsin-855c9.firebasestorage.app",
            messagingSenderId: "677047831958",
            appId: "1:677047831958:web:82c4d37ee0055bfbafa1b7"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            window.modalAc = () => new bootstrap.Modal(document.getElementById('ilanModal')).show();

            window.ilanGonder = async function() {
                try {
                    await addDoc(collection(db, "ilanlar"), {
                        ad: document.getElementById("urunAdi").value,
                        fiyat: document.getElementById("fiyat").value,
                        tarih: Date.now()
                    });
                    document.querySelector('.btn-close').click();
                } catch (e) {
                    window.hataGoster("İlan gönderme hatası: " + e.message);
                    alert("Hata: " + e.message);
                }
            }

            // Verileri Çek
            const q = query(collection(db, "ilanlar"), orderBy("tarih", "desc"));
            onSnapshot(q, (snapshot) => {
                const liste = document.getElementById("ilan-listesi");
                liste.innerHTML = "";
                document.getElementById("durumMesaji").innerText = "Bağlantı Başarılı! İlanlar Listeleniyor:";
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    liste.innerHTML += `<div class="col-12 border p-3 mb-2 bg-white rounded">${data.ad} - ${data.fiyat} TL</div>`;
                });

                if(snapshot.empty) liste.innerHTML = "Hiç ilan yok.";
            }, (error) => {
                window.hataGoster("Veri okuma hatası (Firebase): " + error.message);
                if(error.message.includes("permission")) {
                    window.hataGoster("⚠️ İPUCU: Firestore Kuralları kilitli olabilir!");
                }
            });

        } catch (e) {
            window.hataGoster("Başlatma Hatası: " + e.message);
        }
    </script>
</body>
</html>
