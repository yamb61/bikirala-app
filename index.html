<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiKirala | Stabil</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* TEMEL RENKLER VE AYARLAR */
        :root { --main-color: #FFD000; --dark-color: #000000; }
        body { background-color: #f4f4f4; padding-bottom: 80px; font-family: sans-serif; }
        
        /* NAVBAR (ÜST KISIM) */
        .navbar { background-color: var(--dark-color); padding: 15px; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 24px; font-weight: 900; color: white; text-decoration: none; }
        .brand span { color: var(--main-color); }
        
        /* KATEGORİLER (SOL MENÜ) */
        .wrapper { display: flex; margin-top: 20px; gap: 20px; padding: 0 15px; }
        .sidebar { width: 250px; background: white; padding: 20px; border-radius: 10px; height: fit-content; display: none; }
        .cat-btn { display: block; padding: 10px; color: #333; text-decoration: none; font-weight: bold; border-radius: 5px; margin-bottom: 5px; }
        .cat-btn:hover, .cat-btn.active { background: var(--dark-color); color: var(--main-color); }

        /* İÇERİK VE KARTLAR */
        .content { flex: 1; }
        .card { border: none; border-radius: 10px; overflow: hidden; margin-bottom: 20px; background: white; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-img-top { height: 200px; object-fit: cover; }
        .price-badge { font-size: 18px; font-weight: 800; color: var(--dark-color); }
        
        /* ALT MENÜ (MOBİL) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: var(--dark-color); display: flex; justify-content: space-around; align-items: center; z-index: 2000; border-top: 4px solid var(--main-color); }
        .nav-item { color: #888; text-align: center; font-size: 10px; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; display: block; }
        .nav-item.active { color: var(--main-color); font-weight: bold; }

        /* MASAÜSTÜ GÖRÜNÜMÜ AYARI */
        @media (min-width: 768px) { 
            .sidebar { display: block; } 
            .bottom-nav { display: none; } 
        }

        /* HATA KUTUSU (GİZLİ) */
        #error-box { display:none; position:fixed; top:0; left:0; width:100%; background:red; color:white; padding:10px; text-align:center; z-index:99999; }
    </style>
</head>
<body>

    <div id="error-box"></div>

    <div class="navbar d-flex justify-content-between align-items-center">
        <a href="#" class="brand">bi<span>kirala</span></a>
        
        <div id="auth-section">
            <button class="btn btn-outline-light btn-sm" onclick="modalAc('loginModal')">Giriş Yap</button>
            <button class="btn btn-warning btn-sm fw-bold" onclick="modalAc('registerModal')">Kayıt Ol</button>
        </div>
        <div id="profile-section" class="d-none">
            <span class="text-white small me-2" id="user-display"></span>
            <button class="btn btn-light btn-sm rounded-circle" onclick="cikisYap()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="wrapper">
        <div class="sidebar">
            <h5 class="fw-bold mb-3">Kategoriler</h5>
            <a href="#" class="cat-btn active" onclick="kategoriSec('Hepsi', this)">Tümü</a>
            <a href="#" class="cat-btn" onclick="kategoriSec('Vasıta', this)">🚗 Vasıta</a>
            <a href="#" class="cat-btn" onclick="kategoriSec('Emlak', this)">🏠 Emlak</a>
            <a href="#" class="cat-btn" onclick="kategoriSec('Teknoloji', this)">💻 Teknoloji</a>
            <a href="#" class="cat-btn" onclick="kategoriSec('Giysi', this)">👕 Giysi</a>
        </div>

        <div class="content">
            <div id="sayfa-vitrin" class="page-section">
                <input type="text" class="form-control mb-3" placeholder="🔍 İlan ara..." onkeyup="aramaYap(this.value)">
                <div class="row" id="ilan-listesi">
                    <p class="text-center mt-5 text-muted">Yükleniyor...</p>
                </div>
            </div>

            <div id="sayfa-hesap" class="page-section d-none text-center pt-5">
                <i class="fas fa-user-circle fa-4x mb-3 text-secondary"></i>
                <h3 id="hesap-baslik">Misafir</h3>
                <div id="hesap-butonlar" class="d-none mt-3">
                    <button id="btn-admin" class="btn btn-danger w-50 mb-2 d-none" onclick="adminPaneliAc()">YÖNETİCİ PANELİ</button><br>
                    <button class="btn btn-warning w-50 mb-2" onclick="modalAc('ilanModal')">İlan Ver</button><br>
                    <button class="btn btn-dark w-50" onclick="cikisYap()">Çıkış</button>
                </div>
                <div id="misafir-butonlar" class="mt-3">
                    <button class="btn btn-dark w-50" onclick="modalAc('loginModal')">Giriş Yap</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="sayfaGec('vitrin', this)"><i class="fas fa-home"></i>Vitrin</div>
        <div class="nav-item" onclick="kontrolIlanVer()"><i class="fas fa-plus-circle" style="font-size:35px; color:#FFD000; margin-top:-15px; background:black; border-radius:50%;"></i></div>
        <div class="nav-item" onclick="sayfaGec('hesap', this)"><i class="fas fa-user"></i>Hesabım</div>
    </div>

    <div class="modal fade" id="ilanModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">İlan Ver</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
        <div class="p-3 bg-light text-center border rounded mb-3" onclick="document.getElementById('resimInp').click()"><span id="resimTxt">📸 Fotoğraf Ekle</span><input type="file" id="resimInp" class="d-none" onchange="resimOnizle(this)"></div>
        <input type="text" id="i-baslik" class="form-control mb-2" placeholder="Başlık">
        <input type="number" id="i-fiyat" class="form-control mb-2" placeholder="Fiyat">
        <select id="i-kat" class="form-select mb-2"><option>Vasıta</option><option>Emlak</option><option>Teknoloji</option><option>Giysi</option></select>
        <textarea id="i-aciklama" class="form-control mb-2" placeholder="Açıklama"></textarea>
        <input type="text" id="i-tel" class="form-control mb-2" placeholder="Telefon">
        <button onclick="ilanYayinla()" class="btn btn-dark w-100">YAYINLA</button>
    </div></div></div></div>

    <div class="modal fade" id="detayModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-body p-0">
        <button class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
        <img id="d-img" src="" style="width:100%; height:300px; object-fit:cover;">
        <div class="p-3">
            <h4 id="d-baslik" class="fw-bold">...</h4>
            <h3 id="d-fiyat" class="text-warning fw-bold">...</h3>
            <p id="d-aciklama" class="text-muted">...</p>
            <hr>
            <a id="d-ara" href="#" class="btn btn-dark w-100"><i class="fas fa-phone"></i> ARA</a>
            <button id="d-sil" onclick="ilaniSil()" class="btn btn-outline-danger w-100 mt-2 d-none">SİL (Yönetici)</button>
        </div>
    </div></div></div></div>

    <div class="modal fade" id="loginModal" tabindex="-1"><div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content p-4 text-center"><h4>Giriş</h4><input id="l-mail" class="form-control mb-2" placeholder="Email"><input type="password" id="l-pass" class="form-control mb-2" placeholder="Şifre"><button onclick="girisYap()" class="btn btn-warning w-100">GİRİŞ</button></div></div></div>
    
    <div class="modal fade" id="registerModal" tabindex="-1"><div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content p-4 text-center"><h4>Kayıt</h4><input id="r-mail" class="form-control mb-2" placeholder="Email"><input type="password" id="r-pass" class="form-control mb-2" placeholder="Şifre"><button onclick="kayitOl()" class="btn btn-dark w-100">KAYIT</button></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // --- 1. ADMIN AYARI (BURAYA E-POSTANI YAZ) ---
        const ADMIN_EMAIL = "emeebabaoglu61@gmail.com";
        // ---------------------------------------------

        // FIREBASE AYARLARI
        const firebaseConfig = {
            apiKey: "AIzaSyARO3eKpa058215Sdo3Dqf6U7uTr-z4pMM",
            authDomain: "kiralagitsin-855c9.firebaseapp.com",
            projectId: "kiralagitsin-855c9",
            storageBucket: "kiralagitsin-855c9.firebasestorage.app",
            messagingSenderId: "677047831958",
            appId: "1:677047831958:web:82c4d37ee0055bfbafa1b7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let aktifKullanici = null;
        let tumIlanlar = [];
        let seciliIlanId = null;
        let yuklenecekResim = null;

        // KULLANICI DURUMU İZLE
        auth.onAuthStateChanged(user => {
            aktifKullanici = user;
            arayuzGuncelle();
        });

        function arayuzGuncelle() {
            if(aktifKullanici) {
                document.getElementById('auth-section').classList.add('d-none');
                document.getElementById('profile-section').classList.remove('d-none');
                document.getElementById('user-display').innerText = aktifKullanici.email;
                
                document.getElementById('hesap-baslik').innerText = aktifKullanici.email;
                document.getElementById('hesap-butonlar').classList.remove('d-none');
                document.getElementById('misafir-butonlar').classList.add('d-none');

                if(aktifKullanici.email === ADMIN_EMAIL) {
                    document.getElementById('btn-admin').classList.remove('d-none');
                }
            } else {
                document.getElementById('auth-section').classList.remove('d-none');
                document.getElementById('profile-section').classList.add('d-none');
                
                document.getElementById('hesap-baslik').innerText = "Misafir";
                document.getElementById('hes
