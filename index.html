<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiKirala | Kategorili</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; padding-bottom: 80px; }
        
        /* ÜST BAR */
        .header { background: #FFD000; padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* ARAMA */
        .search-box { background: white; padding: 10px; border-bottom: 1px solid #ddd; }
        .search-input { width: 100%; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; outline: none; }
        
        /* KATEGORİLER (YENİ EKLENEN KISIM) */
        .cat-scroll { overflow-x: auto; white-space: nowrap; padding: 10px 15px; background: white; border-bottom: 1px solid #eee; }
        .cat-btn { 
            display: inline-block; padding: 6px 15px; margin-right: 5px; 
            border: 1px solid #ddd; border-radius: 20px; color: #555; cursor: pointer; font-size: 13px;
        }
        .cat-btn.active { background: black; color: #FFD000; border-color: black; font-weight: bold; }

        /* KARTLAR */
        .card { border: none; border-radius: 10px; margin-bottom: 15px; background: white; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-img-top { height: 200px; object-fit: cover; }
        .price { position: absolute; top: 10px; left: 10px; background: black; color: #FFD000; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        
        /* ALT MENÜ */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 9999; }
        .nav-item { text-align: center; color: #aaa; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: black; font-weight: bold; }
        .add-btn { width: 50px; height: 50px; background: black; color: #FFD000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -25px; border: 4px solid #f4f4f4; }

        /* Sayfalar */
        .page { display: none; }
        .page.active { display: block; }
        
        #debug { display: none; background: red; color: white; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="debug"></div>

    <div class="header d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold"><i class="fas fa-cube"></i> bi<span style="background:black; color:white; padding:0 3px; border-radius:3px;">kirala</span></h4>
    </div>

    <div class="search-box">
        <input type="text" id="aramaInput" class="search-input" placeholder="Ne lazım? (PS5, Drone...)" onkeyup="listeyiGuncelle()">
    </div>

    <div class="cat-scroll">

        <div class="cat-btn" onclick="kategoriSec('Vasıta', this)">🚗 Vasıta</div>
        <div class="cat-btn" onclick="kategoriSec('Elektronik', this)">💻 Elektronik</div>
        <div class="cat-btn" onclick="kategoriSec('Emlak', this)">🏠 Emlak</div>
        <div class="cat-btn" onclick="kategoriSec('Spor', this)">⚽ Spor</div>
    </div>

    <div class="container mt-3">
        <div id="page-home" class="page active">

                    <div class="spinner-border text-warning"></div>
                    <p>Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div id="page-fav" class="page text-center pt-5"><h5>Favoriler</h5><p>Henüz yok.</p></div>
        <div id="page-msg" class="page text-center pt-5"><h5>Mesajlar</h5><p>Kutun boş.</p></div>
        <div id="page-profile" class="page text-center pt-5"><h5>Profil</h5><p>Misafir Girişi</p></div>
