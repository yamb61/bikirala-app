<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Yazarım - Anlık İçerik Üretici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981', // Emerald Yeşil
                        dark: '#1f2937', 
                        graybg: '#f3f4f6'
                    },
                    boxShadow: {
                        'soft': '0 4px 15px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .bk-input { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; transition: all 0.2s; background: white; color: #1f2937; }
        .bk-input:focus { border-color: #10B981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        .dark body { background-color: #111; color: #eee; }
        .dark .bg-white { background-color: #1f2937; border-color: #374151; color: #eee; }
        .dark .bk-input { background-color: #374151; border-color: #4b5563; color: #eee; }
        .dark .bg-gray-50 { background-color: #252525; }
        .dark .shadow-soft { box-shadow: 0 4px 15px rgba(255,255,255,0.08); }
    </style>
</head>
<body class="bg-graybg dark:bg-dark transition-colors">

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="flex justify-between items-center py-6 border-b border-gray-200 dark:border-gray-700 mb-8">
            <h1 class="text-3xl font-extrabold text-primary flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> AI YAZARIM
            </h1>
            <div class="flex items-center gap-4">
                <button onclick="document.documentElement.classList.toggle('dark')" class="w-10 h-10 rounded-full bg-white dark:bg-dark flex items-center justify-center text-gray-700 dark:text-yellow-400 border border-gray-300 dark:border-gray-700 transition">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 bg-white dark:bg-dark p-6 rounded-xl shadow-soft h-fit sticky top-4">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">İçerik Oluştur</h2>
                <form onsubmit="event.preventDefault(); app.generateContent()">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Konu Başlığı</label>
                        <input type="text" id="topic" class="bk-input w-full" placeholder="Örn: Yapay zeka ile SEO">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Anahtar Kelimeler (Virgülle ayır)</label>
                        <input type="text" id="keywords" class="bk-input w-full" placeholder="Örn: AI, SEO, içerik üretimi">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Yazı Tonu</label>
                        <select id="tone" class="bk-input w-full cursor-pointer">
                            <option value="profesyonel">Profesyonel</option>
                            <option value="eğlenceli">Eğlenceli ve Samimi</option>
                            <option value="akademik">Akademik</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow-md mt-2">
                        <i class="fa-solid fa-magic"></i> Oluştur
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div id="seo-metrics" class="bg-white dark:bg-dark p-4 rounded-xl shadow-soft border border-gray-200 dark:border-gray-700 hidden">
                    <h3 class="text-lg font-bold text-primary mb-3"><i class="fa-solid fa-chart-line"></i> SEO Analizi</h3>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <p class="text-2xl font-black text-dark dark:text-white" id="word-count">0</p>
                            <p class="text-xs text-gray-500 mt-1">Kelime Sayısı</p>
                        </div>
                        <div>
                            <p class="text-2xl font-black text-dark dark:text-white" id="keyword-density">0%</p>
                            <p class="text-xs text-gray-500 mt-1">Anahtar Kelime Yoğunluğu</p>
                        </div>
                        <div>
                            <p class="text-2xl font-black text-dark dark:text-white" id="readability-score">0</p>
                            <p class="text-xs text-gray-500 mt-1">Okunabilirlik Skoru</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-dark p-6 rounded-xl shadow-soft min-h-[300px] relative">
                    <h2 class="text-xl font-bold mb-4">Üretilen İçerik</h2>
                    
                    <button onclick="app.copyContent()" id="copy-btn" class="absolute top-6 right-6 text-gray-400 hover:text-primary transition disabled:opacity-50" disabled>
                        <i class="fa-regular fa-copy"></i> Kopyala
                    </button>

                    <div id="content-output" class="prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300">
                        <p class="text-gray-500 dark:text-gray-400 mt-10 text-center">Oluştur butonuna basarak ilk içeriğinizi üretin.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            generateContent: () => {
                const topic = document.getElementById('topic').value.trim();
                const keywords = document.getElementById('keywords').value.trim().split(',').map(k => k.trim()).filter(k => k.length > 0);
                const tone = document.getElementById('tone').value;

                if (!topic) {
                    alert("Lütfen bir konu başlığı girin.");
                    return;
                }

                // Simülasyon Fonksiyonu
                const generatedText = app.simulateAI(topic, keywords, tone);
                
                // DOM'a Yazma
                document.getElementById('content-output').innerHTML = generatedText;
                
                // SEO Metriklerini Hesapla ve Göster
                app.calculateSEO(generatedText, keywords);
                
                document.getElementById('seo-metrics').classList.remove('hidden');
                document.getElementById('copy-btn').disabled = false;
            },

            simulateAI: (topic, keywords, tone) => {
                const keywordList = keywords.length > 0 ? keywords.join(', ') : 'yapay zeka, içerik pazarlaması';
                
                const getToneStyle = (text) => {
                    if (tone === 'eğlenceli') return `**${text}**`;
                    if (tone === 'akademik') return `*${text}*`;
                    return text;
                };

                // Markdown formatında simüle edilmiş AI çıktısı
                let content = `
# ${getToneStyle(topic)}: Geleceğin Anahtarı

<p>Günümüzde dijital pazarlama stratejilerinin merkezinde ${getToneStyle(keywords[0] || 'AI')} destekli çözümler bulunmaktadır. Özellikle ${getToneStyle('içerik üretimi')} süreçleri, bu teknolojiler sayesinde inanılmaz bir hız kazanmıştır. Bir zamanlar günler süren blog yazma işi, artık saniyeler içinde tamamlanabiliyor.</p>

## Yapay Zeka ve SEO İlişkisi

<p>Arama motoru optimizasyonu (SEO), artık sadece anahtar kelime doldurmaktan ibaret değil. Google, kullanıcı deneyimini ve içeriğin kalitesini ön planda tutmaktadır. İşte burada ${getToneStyle('Yapay Zeka')} devreye girer. AI, rakiplerinizin analizini yaparak ve ${getToneStyle(keywords[1] || 'SEO')} kurallarına tam uyum sağlayarak size özel metinler hazırlar.</p>

### Neden AI Yazarım Kullanmalısınız?

<ul>
    <li>**Hız:** Yüksek hacimli içerik ihtiyacınızı saniyeler içinde karşılar.</li>
    <li>**Optimizasyon:** Verilen ${getToneStyle(keywords[2] || 'anahtar kelimeler')} ile en uygun metin yapısını kurar.</li>
    <li>**Verimlilik:** İnsan yazar maliyetlerini düşürür ve yayın akışınızı hızlandırır.</li>
</ul>

<p>Sonuç olarak, başarılı bir dijital varlık için ${getToneStyle('AI araçları')} vazgeçilmezdir. ${getToneStyle('Profesyonel')} tonumuz sayesinde markanızın güvenilirliğini artırırken, ${getToneStyle(keywords[0] || 'AI')} teknolojisinin sınırlarını zorlayabilirsiniz.</p>
`;
                return content;
            },

            calculateSEO: (text, keywords) => {
                // 1. Kelime Sayısı
                const strippedText = text.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
                const wordCount = strippedText.split(' ').length;

                // 2. Anahtar Kelime Yoğunluğu (İlk 3 Anahtar Kelime Üzerinden)
                let keywordOccurrences = 0;
                keywords.slice(0, 3).forEach(kw => {
                    const regex = new RegExp(`\\b${kw}\\b`, 'gi');
                    const matches = strippedText.match(regex);
                    if (matches) {
                        keywordOccurrences += matches.length;
                    }
                });
                const density = wordCount > 0 ? ((keywordOccurrences / wordCount) * 100).toFixed(2) : 0;
                
                // 3. Okunabilirlik Skoru (Basit Simülasyon)
                // Kelime başına ortalama hece ve cümle uzunluğuna dayalıdır.
                // Basitlik için kelime sayısına ve cümle sayısına göre manuel skor verelim.
                const sentenceCount = (strippedText.match(/[.!?]/g) || []).length;
                let readabilityScore = 50; // Başlangıç
                if (wordCount > 150 && sentenceCount > 5) {
                     readabilityScore = 75; // İyi okunabilirlik
                } else if (wordCount > 50 && sentenceCount < 3) {
                     readabilityScore = 40; // Çok kısa veya karmaşık
                }
                
                // DOM'a Yansıtma
                document.getElementById('word-count').innerText = wordCount.toLocaleString();
                document.getElementById('keyword-density').innerText = `${density}%`;
                document.getElementById('readability-score').innerText = readabilityScore;
                
                // Yoğunluk Uyarısı
                const densityEl = document.getElementById('keyword-density');
                densityEl.classList.remove('text-red-500', 'text-orange-500', 'text-primary');
                if (density > 3) {
                    densityEl.classList.add('text-red-500'); // Aşırı doldurma uyarısı
                } else if (density > 1) {
                    densityEl.classList.add('text-orange-500');
                } else {
                    densityEl.classList.add('text-primary'); // Optimal
                }
            },
            
            copyContent: () => {
                const output = document.getElementById('content-output');
                const textToCopy = output.innerText;
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("İçerik başarıyla kopyalandı!");
                }).catch(err => {
                    console.error('Kopyalama hatası:', err);
                    alert("Kopyalama başarısız oldu.");
                });
            }
        };

        // Dark mode başlangıç ayarı
        document.addEventListener('DOMContentLoaded', () => {
            const topicInput = document.getElementById('topic');
            const keywordsInput = document.getElementById('keywords');
            topicInput.value = "Yapay Zeka ve E-ticaretin Geleceği";
            keywordsInput.value = "AI, e-ticaret, yenilik, perakende";
        });
    </script>
</body>
</html>
