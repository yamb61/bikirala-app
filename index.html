<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiKirala | Yönetici Modu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        .navbar { background: #FFD000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 900; color: #000; font-size: 24px; cursor: pointer; user-select: none; }
        
        .card { border: none; border-radius: 10px; transition: 0.2s; background: white; height: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .card-img-top { height: 200px; object-fit: cover; border-top-left-radius: 10px; border-top-right-radius: 10px; }
        
        .btn-ilan { background: #000; color: #FFD000; font-weight: bold; border-radius: 50px; padding: 8px 20px; border: none; }
        .btn-ilan:hover { background: #333; color: #fff; }

        /* SİLME BUTONU (Sadece Admin Görür) */
        .btn-sil {
            display: none; /* Gizli başlar */
            position: absolute; top: 10px; left: 10px;
            background: red; color: white; border: none;
            width: 35px; height: 35px; border-radius: 50%;
            font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10; cursor: pointer;
        }
        .btn-sil:hover { background: darkred; transform: scale(1.1); }

        .price-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;
        }
        
        .kategori-wrapper { overflow-x: auto; white-space: nowrap; padding: 15px 0; background: white; border-bottom: 1px solid #eee; }
        .cat-btn {
            display: inline-block; padding: 8px 20px; margin: 0 5px;
            background: #f1f1f1; color: #333; border-radius: 30px;
            text-decoration: none; font-weight: 500; font-size: 14px;
        }
        .cat-btn.active, .cat-btn:hover { background: #000; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" onclick="adminGirisKontrol()"><i class="fas fa-cube"></i> bi<span style="background:#000; color:#fff; padding:0 3px; border-radius:3px;">kirala</span></a>
            
            <button class="btn btn-ilan" data-bs-toggle="modal" data-bs-target="#ilanModal">
                <i class="fas fa-plus"></i> İlan Ver
            </button>
        </div>
    </nav>

    <div id="adminPanelUyari" class="bg-danger text-white text-center p-2 fw-bold" style="display:none;">
        ⚠️ YÖNETİCİ MODU AKTİF - DİKKATLİ SİLİN!
    </div>

    <div class="kategori-wrapper shadow-sm">
        <div class="container">
            <a href="#" class="cat-btn active" onclick="filtrele('Hepsi', this)">Tümü</a>
            <a href="#" class="cat-btn" onclick="filtrele('Vasıta', this)">🚗 Vasıta</a>
            <a href="#" class="cat-btn" onclick="filtrele('Emlak', this)">🏠 Emlak</a>
            <a href="#" class="cat-btn" onclick="filtrele('Elektronik', this)">💻 Elektronik</a>
            <a href="#" class="cat-btn" onclick="filtrele('Spor', this)">⚽ Spor</a>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <h5 class="fw-bold mb-3">Vitrindeki İlanlar</h5>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="ilan-listesi">
            <div class="text-center w-100 py-5">
                <div class="spinner-border text-warning"></div>
                <p class="mt-2 text-muted">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ilanModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Yeni İlan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="urunAdi" class="form-control mb-3" placeholder="Ürün Adı">
                    <div class="row g-2 mb-3">
                        <div class="col-6"><input type="number" id="fiyat" class="form-control" placeholder="Fiyat (TL)"></div>
                        <div class="col-6">
                            <select id="kategori" class="form-select">
                                <option value="Elektronik">Elektronik</option>
                                <option value="Vasıta">Vasıta</option>
                                <option value="Emlak">Emlak</option>
                                <option value="Spor">Spor</option>
                            </select>
                        </div>
                    </div>
                    <input type="text" id="konum" class="form-control mb-3" placeholder="Konum">
                    <input type="text" id="telefon" class="form-control mb-3" placeholder="Telefon">

                    <div class="p-3 border rounded text-center mb-3 bg-light" onclick="document.getElementById('fotoInput').click()">
                        <p class="m-0 text-muted fw-bold" id="fotoBilgi">📸 Fotoğraf Ekle</p>
                        <input type="file" id="fotoInput" class="d-none" accept="image/*">
                    </div>

                    <button onclick="ilanGonder()" id="gonderBtn" class="btn btn-warning w-100 fw-bold">Yayınla</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARO3eKpa058215Sdo3Dqf6U7uTr-z4pMM",
            authDomain: "kiralagitsin-855c9.firebaseapp.com",
            projectId: "kiralagitsin-855c9",
            storageBucket: "kiralagitsin-855c9.firebasestorage.app",
            messagingSenderId: "677047831958",
            appId: "1:677047831958:web:82c4d37ee0055bfbafa1b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let seciliResimData = "https://via.placeholder.com/400x300?text=Resim+Yok";
        let aktifKategori = "Hepsi";
        let isAdmin = false; // Yönetici mi?
        let clickSayisi = 0; // Şifre için tıklama sayacı

        // --- YÖNETİCİ GİRİŞİ (Gizli Özellik) ---
        window.adminGirisKontrol = function() {
            clickSayisi++;
            if(clickSayisi >= 3) { // 3 kere tıklayınca sor
                let sifre = prompt("Patron Şifresi Nedir?");
                if(sifre === "1234") { // Şifreyi buradan değiştirebilirsin
                    isAdmin = true;
                    alert("Hoşgeldin Patron! Silme yetkisi açıldı.");
                    document.getElementById('adminPanelUyari').style.display = 'block';
                    verileriCek(); // Listeyi yenile (Sil butonları gelsin)
                } else {
                    alert("Yanlış şifre!");
                }
                clickSayisi = 0;
            }
        }

        // --- İLAN SİLME ---
        window.ilanSil = async function(id) {
            if(confirm("Bu ilanı gerçekten silmek istiyor musun?")) {
                try {
                    await deleteDoc(doc(db, "ilanlar", id));
                    // Veritabanından silinince otomatik olarak ekrandan da gidecek (onSnapshot sayesinde)
                } catch (e) {
                    alert("Silme hatası: " + e.message);
                }
            }
        }

        // --- FOTOĞRAF İŞLEME ---
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 500;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    seciliResimData = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('fotoBilgi').innerText = "✔ Fotoğraf Hazır";
                    document.getElementById('fotoBilgi').classList.add('text-success');
                }
                img.src = evt.target.result;
            }
            reader.readAsDataURL(file);
        });

        // --- İLAN GÖNDERME ---
        window.ilanGonder = async function() {
            const btn = document.getElementById("gonderBtn");
            btn.innerText = "Yükleniyor..."; btn.disabled = true;
            try {
                await addDoc(collection(db, "ilanlar"), {
                    ad: document.getElementById("urunAdi").value,
                    fiyat: document.getElementById("fiyat").value,
                    konum: document.getElementById("konum").value,
                    telefon: document.getElementById("telefon").value,
                    kategori: document.getElementById("kategori").value,
                    resim: seciliResimData,
                    tarih: Date.now()
                });
                document.querySelector('.btn-close').click();
                document.getElementById("urunAdi").value = "";
                seciliResimData = "https://via.placeholder.com/400x300?text=Resim+Yok";
            } catch (e) { alert("Hata: " + e.message); } 
            finally { btn.innerText = "Yayınla"; btn.disabled = false; }
        }

        window.filtrele = function(kat, el) {
            aktifKategori = kat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            verileriCek();
        }

        function verileriCek() {
            const liste = document.getElementById("ilan-listesi");
            let q = query(collection(db, "ilanlar"), orderBy("tarih", "desc"));
            if (aktifKategori !== 'Hepsi') q = query(collection(db, "ilanlar"), where("kategori", "==", aktifKategori));

            onSnapshot(q, (snapshot) => {
                liste.innerHTML = "";
                if(snapshot.empty) { liste.innerHTML = "<p class='text-center w-100 text-muted'>İlan yok.</p>"; return; }
                
                snapshot.forEach((belge) => {
                    const data = belge.data();
                    const id = belge.id; // Silmek için ID lazım
                    const waLink = `https://wa.me/90${data.telefon}`;
                    
                    // Eğer Adminsen sil butonunu göster (style="display:block") yoksa gizle
                    const silButonuStili = isAdmin ? "display:block;" : "";

                    liste.innerHTML += `
                    <div class="col">
                        <div class="card h-100">
                            <button class="btn-sil" style="${silButonuStili}" onclick="ilanSil('${id}')">
                                <i class="fas fa-trash"></i>
                            </button>

                            <span class="price-badge">${data.fiyat} TL</span>
                            <img src="${data.resim}" class="card-img-top">
                            <div class="card-body">
                                <h6 class="card-title fw-bold text-truncate">${data.ad}</h6>
                                <p class="small text-muted mb-2">📍 ${data.konum || 'Türkiye'}</p>
                                <a href="${waLink}" target="_blank" class="btn btn-outline-dark btn-sm w-100">Kirala</a>
                            </div>
                        </div>
                    </div>`;
                });
            });
        }
        
        verileriCek();
    </script>
</body>
</html>
