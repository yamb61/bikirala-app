<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiKirala | Sade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { padding-bottom: 70px; background: #f4f4f4; font-family: sans-serif; }
        .header { background: #FFD000; padding: 15px; position: sticky; top: 0; z-index: 1000; }
        .card { margin-bottom: 15px; border: none; border-radius: 10px; overflow: hidden; }
        .card-img-top { height: 200px; object-fit: cover; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div class="header d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold">bi<span class="bg-dark text-white rounded px-1">kirala</span></h4>
    </div>

    <div class="container mt-3">
        <div id="sayfa-vitrin" class="page active">
            <div id="ilan-listesi">
                </div>
        </div>

        <div id="sayfa-profil" class="page text-center pt-5">
            <h3>Profil</h3>
            <p>Sistem çalışıyor.</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div onclick="sayfaGec('vitrin')"><i class="fas fa-home fs-4"></i></div>
        <div onclick="modalAc()"><i class="fas fa-plus-circle fs-1 text-warning"></i></div>
        <div onclick="sayfaGec('profil')"><i class="fas fa-user fs-4"></i></div>
    </div>

    <div class="modal fade" id="ilanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">İlan Ver</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="file" id="resimInput" class="form-control mb-2">
                    <input type="text" id="inpAd" class="form-control mb-2" placeholder="Başlık">
                    <input type="number" id="inpFiyat" class="form-control mb-2" placeholder="Fiyat">
                    <input type="text" id="inpTel" class="form-control mb-2" placeholder="Telefon">
                    <button onclick="ilanYayinla()" class="btn btn-dark w-100">YAYINLA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARO3eKpa058215Sdo3Dqf6U7uTr-z4pMM",
            authDomain: "kiralagitsin-855c9.firebaseapp.com",
            projectId: "kiralagitsin-855c9",
            storageBucket: "kiralagitsin-855c9.firebasestorage.app",
            messagingSenderId: "677047831958",
            appId: "1:677047831958:web:82c4d37ee0055bfbafa1b7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let seciliResim = "https://via.placeholder.com/300";

        // VERİLERİ DİNLE
        db.collection("ilanlar").orderBy("tarih", "desc").onSnapshot(snap => {
            const div = document.getElementById("ilan-listesi");
            div.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                div.innerHTML += `
                <div class="card">
                    <img src="${d.resim}" class="card-img-top">
                    <div class="card-body">
                        <h5 class="fw-bold">${d.ad}</h5>
                        <p>${d.fiyat} TL</p>
                        <a href="https://wa.me/90${d.tel}" class="btn btn-warning w-100">Kirala</a>
                    </div>
                </div>`;
            });
        });

        // FOTOĞRAF ÇEVİR
        document.getElementById('resimInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) { seciliResim = evt.target.result; }
            reader.readAsDataURL(file);
        });

        // YAYINLA
        function ilanYayinla() {
            const ad = document.getElementById('inpAd').value;
            const fiyat = document.getElementById('inpFiyat').value;
            const tel = document.getElementById('inpTel').value;

            if(!ad) { alert("Başlık yaz!"); return; }

            db.collection("ilanlar").add({
                ad: ad, fiyat: fiyat, tel: tel, resim: seciliResim, tarih: Date.now()
            }).then(() => {
                alert("Tamamdır!");
                location.reload();
            });
        }

        function sayfaGec(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('sayfa-' + id).classList.add('active');
        }

        function modalAc() {
            new bootstrap.Modal(document.getElementById('ilanModal')).show();
        }
    </script>
</body>
</html>
