<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiKirala | Garantili</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; padding-bottom: 80px; }
        .header { background: #FFD000; padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-box { background: white; padding: 10px; border-bottom: 1px solid #ddd; }
        .search-input { width: 100%; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; outline: none; }
        
        .card { border: none; border-radius: 10px; margin-bottom: 15px; background: white; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-img-top { height: 200px; object-fit: cover; }
        .price { position: absolute; top: 10px; left: 10px; background: black; color: #FFD000; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 9999; }
        .nav-item { text-align: center; color: #aaa; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: black; font-weight: bold; }
        
        .add-btn { width: 50px; height: 50px; background: black; color: #FFD000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -25px; border: 4px solid #f4f4f4; }

        /* Sayfalar */
        .page { display: none; }
        .page.active { display: block; }

        #debug { display: none; background: red; color: white; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="debug"></div>

    <div class="header d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold"><i class="fas fa-cube"></i> bi<span style="background:black; color:white; padding:0 3px; border-radius:3px;">kirala</span></h4>
        <span class="badge bg-dark">v10.0</span>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" placeholder="Ne lazım? (PS5, Araç...)" onkeyup="aramaYap(this.value)">
    </div>

    <div class="container mt-3">
        <div id="page-home" class="page active">
            <div id="ilan-listesi">
                <div class="text-center mt-5">
                    <div class="spinner-border text-warning"></div>
                    <p>Bağlanıyor...</p>
                </div>
            </div>
        </div>

        <div id="page-fav" class="page text-center pt-5"><h5>Favoriler Boş</h5></div>
        <div id="page-msg" class="page text-center pt-5"><h5>Mesajlar</h5><p>Mesajınız yok.</p></div>
        <div id="page-profile" class="page text-center pt-5"><h5>Profil</h5><p>Misafir Girişi</p></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="sayfa('home', this)"><i class="fas fa-home"></i>Vitrin</div>
        <div class="nav-item" onclick="sayfa('fav', this)"><i class="fas fa-heart"></i>Favori</div>
        <div class="nav-item" onclick="modalAc()"><div class="add-btn"><i class="fas fa-plus"></i></div></div>
        <div class="nav-item" onclick="sayfa('msg', this)"><i class="fas fa-comment"></i>Mesaj</div>
        <div class="nav-item" onclick="sayfa('profile', this)"><i class="fas fa-user"></i>Profil</div>
    </div>

    <div class="modal fade" id="ilanModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">İlan Ver</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="ad" class="form-control mb-2" placeholder="Başlık">
                    <input type="number" id="fiyat" class="form-control mb-2" placeholder="Fiyat">
                    <input type="text" id="tel" class="form-control mb-2" placeholder="Telefon">
                    <select id="kat" class="form-select mb-3">
                        <option>Elektronik</option>
                        <option>Vasıta</option>
                        <option>Emlak</option>
                    </select>
                    <div class="bg-light p-3 text-center border rounded mb-3" onclick="document.getElementById('resim').click()">
                        <span id="resimTxt">📸 Fotoğraf Seç</span>
                        <input type="file" id="resim" class="d-none" accept="image/*" onchange="resimSecildi(this)">
                    </div>
                    <button onclick="ilanGonder()" id="btnGonder" class="btn btn-warning w-100 fw-bold">YAYINLA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Hata Yakalama
        window.onerror = function(msg) {
            document.getElementById('debug').style.display = 'block';
            document.getElementById('debug').innerText = "HATA: " + msg;
        }

        // AYARLAR
        const firebaseConfig = {
            apiKey: "AIzaSyARO3eKpa058215Sdo3Dqf6U7uTr-z4pMM",
            authDomain: "kiralagitsin-855c9.firebaseapp.com",
            projectId: "kiralagitsin-855c9",
            storageBucket: "kiralagitsin-855c9.firebasestorage.app",
            messagingSenderId: "677047831958",
            appId: "1:677047831958:web:82c4d37ee0055bfbafa1b7"
        };

        // BAŞLAT
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let tumVeriler = [];
        let seciliResim = "https://via.placeholder.com/400x300?text=Resim+Yok";

        // FONKSİYONLAR
        function sayfa(id, btn) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            btn.classList.add('active');
        }

        function modalAc() {
            new bootstrap.Modal(document.getElementById('ilanModal')).show();
        }

        function resimSecildi(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 500;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    seciliResim = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('resimTxt').innerText = "✔ Tamam";
                    document.getElementById('resimTxt').style.color = "green";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function ilanGonder() {
            const btn = document.getElementById('btnGonder');
            btn.innerText = "Yükleniyor..."; btn.disabled = true;

            db.collection("ilanlar").add({
                ad: document.getElementById('ad').value,
                fiyat: document.getElementById('fiyat').value,
                tel: document.getElementById('tel').value,
                kategori: document.getElementById('kat').value,
                resim: seciliResim,
                tarih: Date.now()
            }).then(() => {
                alert("İlanın Yayında!");
                location.reload();
            }).catch(err => {
                alert("Hata: " + err.message);
                btn.innerText = "YAYINLA"; btn.disabled = false;
            });
        }

        function aramaYap(kelime) {
            kelime = kelime.toLowerCase();
            const sonuc = tumVeriler.filter(d => d.ad.toLowerCase().includes(kelime));
            listeyiBas(sonuc);
        }

        function listeyiBas(liste) {
            const div = document.getElementById("ilan-listesi");
            div.innerHTML = "";
            if(liste.length === 0) { div.innerHTML = "<p class='text-center mt-5 text-muted'>Sonuç yok.</p>"; return; }
            
            liste.forEach(d => {
                div.innerHTML += `
                <div class="card">
                    <span class="price">${d.fiyat} TL</span>
                    <img src="${d.resim}" class="card-img-top">
                    <div class="card-body p-2">
                        <h6 class="fw-bold mb-1">${d.ad}</h6>
                        <a href="https://wa.me/90${d.tel}" class="btn btn-dark w-100 mt-2 rounded-pill">Kirala</a>
                    </div>
                </div>`;
            });
        }

        // VERİLERİ ÇEK
        db.collection("ilanlar").orderBy("tarih", "desc").onSnapshot(snap => {
            tumVeriler = [];
            snap.forEach(doc => {
                let d = doc.data();
                d.id = doc.id;
                tumVeriler.push(d);
            });
            listeyiBas(tumVeriler);
        }, err => {
            document.getElementById('debug').style.display = 'block';
            document.getElementById('debug').innerText = "BAĞLANTI HATASI: " + err.message;
        });

    </script>
</body>
</html>
